# Compiles the contract, runs the suite and builds the app on every push and
# pull request. A red run means the commit must not ship.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: compile, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Same pin as docker/toolchain.Dockerfile: the 0.31 compiler line, which
      # targets the ledger the public networks run.
      - name: Install the Compact compiler
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/compact" update 0.31
          "$HOME/.local/bin/compact" compile --version

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile the contract
        run: |
          rm -rf managed/cepush
          npm run compact

      # managed/ is committed. Compilation is deterministic, so a diff here
      # means the committed circuits and keys do not match the source.
      - name: Check the committed artefacts match the source
        run: git diff --exit-code --stat -- managed

      - name: Test
        run: npm test

      - name: Type-check and build the app
        run: npm run build
        env:
          VITE_NETWORK_ID: preprod
